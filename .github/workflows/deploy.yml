name: Deploy to Beget

# Сайт выкладывается автоматически при каждом пуше в main.
# Кнопка «Run workflow» на вкладке Actions запускает выкладку вручную.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Проверить, что ключевые файлы на месте
        run: |
          for f in index.html 404.html privacy.html .htaccess robots.txt sitemap.xml \
                   css/style.css js/main.js favicon.svg api/lead.php \
                   projects/grafit.html projects/akvarel.html projects/glubina.html \
                   assets/fonts/montserrat-latin.woff2 assets/fonts/montserrat-cyrillic.woff2; do
            [ -f "$f" ] || { echo "::error::нет файла $f — выкладка остановлена"; exit 1; }
          done
          echo "все ключевые файлы на месте"

      # Токен бота и id чата не хранятся в репозитории: конфиг обработчика
      # заявок собирается здесь из секретов и уезжает на хостинг вместе с сайтом.
      - name: Собрать конфиг Telegram-бота
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "::warning::секреты TG_BOT_TOKEN / TG_CHAT_ID не заданы — заявки пойдут в WhatsApp"
            exit 0
          fi
          mkdir -p api
          {
            echo "<?php"
            echo "// файл собирается автоматически при выкладке, руками не править"
            echo "return ["
            echo "    'token' => '${TG_BOT_TOKEN}',"
            echo "    'chat_id' => '${TG_CHAT_ID}',"
            echo "];"
          } > api/config.php
          echo "конфиг создан"

      # Разовая уборка: старый сайт на WordPress переезжает в папку _old_wp.
      # Файлы сохраняются, но доступ к ним закрыт в .htaccess.
      # Шаг безопасен при повторных запусках: если переносить уже нечего,
      # команды просто ничего не делают и деплой продолжается.
      - name: Убрать старый WordPress в архивную папку
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" <<'LFTP'
          set cmd:fail-exit no
          set ftp:passive-mode on
          set ssl:verify-certificate no
          mkdir -p _old_wp
          mv wp-admin            _old_wp/wp-admin
          mv wp-content          _old_wp/wp-content
          mv wp-includes         _old_wp/wp-includes
          mv index.php           _old_wp/index.php
          mv xmlrpc.php          _old_wp/xmlrpc.php
          mv wp-activate.php     _old_wp/wp-activate.php
          mv wp-blog-header.php  _old_wp/wp-blog-header.php
          mv wp-comments-post.php _old_wp/wp-comments-post.php
          mv wp-config.php       _old_wp/wp-config.php
          mv wp-config-sample.php _old_wp/wp-config-sample.php
          mv wp-cron.php         _old_wp/wp-cron.php
          mv wp-links-opml.php   _old_wp/wp-links-opml.php
          mv wp-load.php         _old_wp/wp-load.php
          mv wp-login.php        _old_wp/wp-login.php
          mv wp-mail.php         _old_wp/wp-mail.php
          mv wp-settings.php     _old_wp/wp-settings.php
          mv wp-signup.php       _old_wp/wp-signup.php
          mv wp-trackback.php    _old_wp/wp-trackback.php
          mv license.txt         _old_wp/license.txt
          mv readme.html         _old_wp/readme.html
          cls -1
          bye
          LFTP
          echo "уборка завершена"

      - name: Залить на хостинг по FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ftp
          # в репозитории лежат и служебные файлы — на хостинг они не нужны
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            scripts/**
            CLAUDE.md
            DEPLOY.md
            **/.DS_Store
